kind = "web"
previewPath = "/"
title = "Stockity Website"
version = "1.0.0"
id = "artifacts/stockity-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20544

[services.development]
run = "pnpm --filter @workspace/stockity-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stockity-web", "run", "build" ]
publicDir = "artifacts/stockity-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20544"
BASE_PATH = "/"
